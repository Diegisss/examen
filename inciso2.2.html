<html>

<body>
    <script>
        valor = prompt("Ingrese el valor 1", ""); valor2 = prompt("Ingrese el valor 2", "");
        document.write("Sin ParseInt (concatena) " + valor + " + " + valor2 + " = ");
        sum_str = valor + valor2; document.write(sum_str + "<br>");
        document.write("Con ParseInt (suma) " + valor + " + " + valor2 + " = ");
        p_i_valor = parseInt(valor); p_i_valor2 = parseInt(valor2);
        sum_val = p_i_valor + p_i_valor2; document.write(sum_val + "<br>")
    </script>
</body>

</html>
